<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Two Birds, One Rope</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="panel">
      <h1>Two Birds, One Rope</h1>
      <div id="panel-body"></div>
    </div>
    <canvas id="canvas" hidden></canvas>
    <label id="sensitivity" hidden>
      Mic sensitivity
      <input id="sensitivity-input" type="range" step="1" />
      <output id="sensitivity-value"></output>
    </label>
    <form id="chat" hidden autocomplete="off">
      <ol id="chat-log"></ol>
      <input id="chat-input" placeholder="Chat silently (Enter)" aria-label="Chat with your partner" />
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
